name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "bin/iso-bunner${ext}" .

      - uses: actions/upload-artifact@v4
        with:
          name: iso-bunner-${{ runner.os }}
          path: bin/
